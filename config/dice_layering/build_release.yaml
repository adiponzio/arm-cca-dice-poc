%YAML 1.2
---
description: >-
  Since by default rmm is built in Debug, force the Release flag.
buildex:
  runners:
    QEMU:
      rmm:
        params:
          -DCMAKE_BUILD_TYPE: Release
        artifacts:
          RMM: ${param:builddir}/Release/rmm.img
